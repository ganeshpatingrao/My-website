<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="login_page.css">
    <script>
        function handleLogin(event) {
            event.preventDefault();

            let inputEmail = document.getElementById("email").value;
            let inputPassword = document.getElementById("password").value;

            // Saved details get karne
            let savedEmail = localStorage.getItem("savedEmail");
            let savedPassword = localStorage.getItem("savedPassword");

            if (!savedEmail || !savedPassword) {
                alert("Account is not created, please first create a account.");
                window.location.href = "register.html";
                return false;
            }

            if (inputEmail === savedEmail && inputPassword === savedPassword) {
                alert("Login Successful!");
                window.location.href = "dashboard.html";
            } else {
                alert("Please enter correct email or password.");
            }
        }
    </script>
</head>
<body>
    <form class="login_form" onsubmit="handleLogin(event)">
        <h2>Login</h2>
        
        <label  for="email">Email: </label>
        <input type="email" id="email" placeholder="example@gmail.com" required><br><br>
        
        <label for="password">Password: </label>
        <input type="password" id="password" placeholder="Enter your password" required><br><br>
        
        <input type="submit" value="Login" class="submit">
        
        <p style="text-align: center; margin-top: 15px; font-size: 16px;">
            Want to create new account? <a class="login_page_sign_up" href="register.html">Sign Up</a>
        </p>
        <p style="text-align: center;">
            <a class="login_page_sign_up" href="index.html">← Go to main page</a>
        </p>
    </form>
</body>
</html>
